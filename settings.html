            <div style="margin-top: 10px;">
                <button id="dooms-open-settings-btn" class="menu_button" title="打开 Doom's Enhancement Suite 设置">
                    <i class="fa-solid fa-gear"></i> 打开设置
                </button>
                <button id="dooms-whats-new-btn" class="menu_button" title="显示最新版本说明">
                    <i class="fa-solid fa-bullhorn"></i> 最新更新
                </button>
            </div>

            <div id="dooms-version-display" style="margin-top: 10px; text-align: center; opacity: 0.6; font-size: 0.85em;">
            </div>
        </div>
    </div>
</div>
